name: Avisos RK47

on:
  workflow_dispatch:

jobs:
  aviso:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar aviso a Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"content":"🚨 RK47 | PRUEBA: Robo a negocio disponible."}' \
            "$DISCORD_WEBHOOK_URL"

name: Avisos RK47

on:
  workflow_dispatch:
    inputs:
      actividad:
        description: 'Nombre de la actividad'
        required: true
        default: 'Búsqueda de contenedor'
        type: string

jobs:
  aviso:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar aviso a Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACTIVIDAD: ${{ inputs.actividad }}
        run: |
          MENSAJE=$(jq -n \
            --arg texto "🚨 RK47 | $ACTIVIDAD" \
            '{content: $texto}')

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$MENSAJE" \
            "$DISCORD_WEBHOOK_URL"
